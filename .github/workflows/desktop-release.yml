name: Tauri Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ($tag -ne $version) {
            Write-Error "Tag '$tag' does not match package version '$version'"
            exit 1
          }

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows x64 NSIS installer
        run: npm run tauri:build

      - name: Report installer size and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Tauri NSIS installer was not produced."
            exit 1
          }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($installer.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($installer.Name)" -NoNewline
          Write-Output ("NSIS installer size: {0:N2} MiB" -f ($installer.Length / 1MB))

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-effect-generator-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sha256

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $existing = gh release view $tag --json id --jq .id 2>$null
          if ($existing) {
            Write-Error "Release '$tag' already exists; refusing to overwrite."
            exit 1
          }
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sha = Get-Item "$($installer.FullName).sha256"
          gh release create $tag $installer.FullName $sha.FullName --generate-notes --title $tag
