name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ($tag -ne $version) {
            Write-Error "Tag '$tag' does not match package version '$version'"
            exit 1
          }

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Web build
        run: npm run build

      - name: Build Windows x64 portable ZIP
        run: npm run desktop:make

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-effect-generator-windows
          path: |
            out/PixelEffectGenerator-*.zip
            out/PixelEffectGenerator-*.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $existing = gh release view $tag --json id --jq .id 2>$null
          if ($existing) {
            Write-Error "Release '$tag' already exists; refusing to overwrite."
            exit 1
          }
          $zip = Get-ChildItem out/PixelEffectGenerator-*.zip | Select-Object -First 1
          $sha = Get-ChildItem out/PixelEffectGenerator-*.sha256 | Select-Object -First 1
          gh release create $tag $zip.FullName $sha.FullName --generate-notes --title $tag
