<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b1b1b" />
    <link rel="icon" type="image/svg+xml" href="/effect-mark.svg" />
    <script>
      try {
        const preference = localStorage.getItem('pixel-effect-generator:theme');
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1b1b' : '#eeeeee';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>Pixel Effect Generator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
