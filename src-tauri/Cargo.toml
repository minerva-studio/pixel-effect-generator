[package]
name = "pixel-effect-generator"
version = "0.1.0"
description = "Deterministic pixel-art visual effect generator"
authors = ["Minerva Game Studio"]
edition = "2021"

[lib]
name = "pixel_effect_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2.7.3"
uuid = { version = "1", features = ["v4"] }
